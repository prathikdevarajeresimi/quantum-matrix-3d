<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Matrix 3D // Interactive Particle Sphere</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #030308;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas3d {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: absolute;
      top: 25px;
      left: 25px;
      pointer-events: none;
      z-index: 10;
    }
    h1 {
      font-size: 1.8rem;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      font-weight: 800;
    }
    p {
      color: #8892b0;
      font-size: 0.95rem;
      margin-top: 6px;
    }
    .panel {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 28, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.3);
      backdrop-filter: blur(10px);
      border-radius: 40px;
      padding: 10px 24px;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      z-index: 10;
    }
    .btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover, .btn.active {
      background: #00f0ff;
      color: #030308;
      font-weight: bold;
      border-color: #00f0ff;
      box-shadow: 0 0 15px #00f0ff;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="hud">
    <h1>Quantum Matrix 3D</h1>
    <p>Move mouse to warp gravity • Scroll to zoom</p>
  </div>

  <div class="panel">
    <button class="btn active" id="btnSphere">Quantum Sphere</button>
    <button class="btn" id="btnTorus">Hyper Torus</button>
    <button class="btn" id="btnWave">Cosmic Wave</button>
  </div>

  <canvas id="canvas3d"></canvas>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 240;

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const particleCount = 7000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const targetPositions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    // Initial shape: Quantum Sphere
    function setSphere() {
      const radius = 90;
      for (let i = 0; i < particleCount; i++) {
        const phi = Math.acos(-1 + (2 * i) / particleCount);
        const theta = Math.sqrt(particleCount * Math.PI) * phi;
        targetPositions[i * 3] = radius * Math.cos(theta) * Math.sin(phi);
        targetPositions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
        targetPositions[i * 3 + 2] = radius * Math.cos(phi);
      }
    }

    function setTorus() {
      const R = 75;
      const r = 30;
      for (let i = 0; i < particleCount; i++) {
        const u = Math.random() * Math.PI * 2;
        const v = Math.random() * Math.PI * 2;
        targetPositions[i * 3] = (R + r * Math.cos(v)) * Math.cos(u);
        targetPositions[i * 3 + 1] = (R + r * Math.cos(v)) * Math.sin(u);
        targetPositions[i * 3 + 2] = r * Math.sin(v);
      }
    }

    function setWave() {
      const size = 180;
      const step = size / Math.sqrt(particleCount);
      let idx = 0;
      for (let x = -size / 2; x < size / 2; x += step) {
        for (let z = -size / 2; z < size / 2; z += step) {
          if (idx < particleCount) {
            targetPositions[idx * 3] = x;
            targetPositions[idx * 3 + 1] = Math.sin(x * 0.08) * 20 + Math.cos(z * 0.08) * 20;
            targetPositions[idx * 3 + 2] = z;
            idx++;
          }
        }
      }
    }

    setSphere();

    // Populate initial positions & colors
    const colorA = new THREE.Color(0x00f0ff);
    const colorB = new THREE.Color(0xff007f);

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = targetPositions[i * 3];
      positions[i * 3 + 1] = targetPositions[i * 3 + 1];
      positions[i * 3 + 2] = targetPositions[i * 3 + 2];

      const mixed = colorA.clone().lerp(colorB, (i / particleCount));
      colors[i * 3] = mixed.r;
      colors[i * 3 + 1] = mixed.g;
      colors[i * 3 + 2] = mixed.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 1.8,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // Mouse tracking
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;

    window.addEventListener('mousemove', e => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.002;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.002;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Buttons
    const btnSphere = document.getElementById('btnSphere');
    const btnTorus = document.getElementById('btnTorus');
    const btnWave = document.getElementById('btnWave');
    const allBtns = [btnSphere, btnTorus, btnWave];

    function activateBtn(btn) {
      allBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    btnSphere.onclick = () => { activateBtn(btnSphere); setSphere(); };
    btnTorus.onclick = () => { activateBtn(btnTorus); setTorus(); };
    btnWave.onclick = () => { activateBtn(btnWave); setWave(); };

    // Animation Loop
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;

      particles.rotation.y += 0.003 + targetX * 0.02;
      particles.rotation.x += 0.002 + targetY * 0.02;

      // Morph towards targets
      const posAttr = geometry.attributes.position;
      for (let i = 0; i < particleCount * 3; i++) {
        posAttr.array[i] += (targetPositions[i] - posAttr.array[i]) * 0.04;
      }
      posAttr.needsUpdate = true;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
